<svg xmlns="http://www.w3.org/2000/svg" viewBox="-112 -112 224 224" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round">
  <defs>
    <pattern id="rv-hatch" width="2.6" height="2.6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="2.6" stroke="currentColor" stroke-width=".7"/>
    </pattern>
    <!-- cardinal point: filled half + hatched half -->
    <g id="rv-card">
      <path d="M0-88 L11-15 L0 0 Z" fill="currentColor" stroke-width="1.1"/>
      <path d="M0-88 L-11-15 L0 0 Z" fill="url(#rv-hatch)" stroke-width="1.1"/>
      <path d="M0-84 V-6" stroke-width=".6"/>
      <!-- fleur-de-lis crown -->
      <path d="M-6.5-88.5 H6.5 V-91 H-6.5 Z" fill="currentColor" stroke-width=".8"/>
      <path d="M0-109 C4.6-103 5.6-97 0-91.5 C-5.6-97 -4.6-103 0-109 Z" fill="currentColor" stroke-width=".8"/>
      <path d="M-1.5-92 C-5-97 -11.5-99.5 -13-94.5 C-14-90.5 -9.5-88.6 -7.6-91.8" stroke-width="1.5"/>
      <path d="M1.5-92 C5-97 11.5-99.5 13-94.5 C14-90.5 9.5-88.6 7.6-91.8" stroke-width="1.5"/>
      <circle cx="-7.6" cy="-91.8" r="1" fill="currentColor" stroke="none"/>
      <circle cx="7.6" cy="-91.8" r="1" fill="currentColor" stroke="none"/>
    </g>
    <!-- diagonal point -->
    <g id="rv-diag">
      <path d="M0-64 L7.5-12 L0 0 Z" fill="currentColor" stroke-width="1"/>
      <path d="M0-64 L-7.5-12 L0 0 Z" fill="url(#rv-hatch)" stroke-width="1"/>
      <path d="M0-60 V-6" stroke-width=".5"/>
    </g>
    <!-- minor point between main ones -->
    <g id="rv-minor">
      <path d="M0-46 L4-12 L0-6 L-4-12 Z" stroke-width=".8" fill="url(#rv-hatch)"/>
    </g>
  </defs>

  <!-- outer riveted ring -->
  <circle r="85" stroke-width="3.4"/>
  <circle r="76.5" stroke-width="1.3"/>
  <g fill="currentColor" stroke="none">
    <circle cx="10.4" cy="-79.3" r="2"/><circle cx="30.6" cy="-73.9" r="2"/><circle cx="48.7" cy="-63.5" r="2"/><circle cx="63.5" cy="-48.7" r="2"/><circle cx="73.9" cy="-30.6" r="2"/><circle cx="79.3" cy="-10.4" r="2"/>
    <circle cx="79.3" cy="10.4" r="2"/><circle cx="73.9" cy="30.6" r="2"/><circle cx="63.5" cy="48.7" r="2"/><circle cx="48.7" cy="63.5" r="2"/><circle cx="30.6" cy="73.9" r="2"/><circle cx="10.4" cy="79.3" r="2"/>
    <circle cx="-10.4" cy="79.3" r="2"/><circle cx="-30.6" cy="73.9" r="2"/><circle cx="-48.7" cy="63.5" r="2"/><circle cx="-63.5" cy="48.7" r="2"/><circle cx="-73.9" cy="30.6" r="2"/><circle cx="-79.3" cy="10.4" r="2"/>
    <circle cx="-79.3" cy="-10.4" r="2"/><circle cx="-73.9" cy="-30.6" r="2"/><circle cx="-63.5" cy="-48.7" r="2"/><circle cx="-48.7" cy="-63.5" r="2"/><circle cx="-30.6" cy="-73.9" r="2"/><circle cx="-10.4" cy="-79.3" r="2"/>
  </g>

  <!-- degree scale -->
  <circle r="71" stroke-width=".9"/>
  <circle r="71" stroke-width="3.2" stroke-dasharray=".6 2.498" stroke-linecap="butt" transform="rotate(-.3)"/>
  <circle r="68.4" stroke-width="5" stroke-dasharray=".7 17.2" stroke-linecap="butt"/>
  <circle r="64.5" stroke-width=".7"/>

  <!-- fine rays -->
  <g stroke-width=".45" opacity=".55">
    <path d="M0-16V-64M0 16V64M-16 0H-64M16 0H64"/>
    <path d="M6.1-14.8 24.5-59.1M-6.1-14.8-24.5-59.1M6.1 14.8 24.5 59.1M-6.1 14.8-24.5 59.1"/>
    <path d="M14.8-6.1 59.1-24.5M-14.8-6.1-59.1-24.5M14.8 6.1 59.1 24.5M-14.8 6.1-59.1 24.5"/>
    <path d="M11.3-11.3 45.3-45.3M-11.3-11.3-45.3-45.3M11.3 11.3 45.3 45.3M-11.3 11.3-45.3 45.3"/>
  </g>
  <circle r="40" stroke-width=".6" stroke-dasharray="1 2.2"/>

  <!-- minor points (22.5deg) -->
  <g>
    <use href="#rv-minor" transform="rotate(22.5)"/><use href="#rv-minor" transform="rotate(67.5)"/>
    <use href="#rv-minor" transform="rotate(112.5)"/><use href="#rv-minor" transform="rotate(157.5)"/>
    <use href="#rv-minor" transform="rotate(202.5)"/><use href="#rv-minor" transform="rotate(247.5)"/>
    <use href="#rv-minor" transform="rotate(292.5)"/><use href="#rv-minor" transform="rotate(337.5)"/>
  </g>
  <!-- diagonal points -->
  <g>
    <use href="#rv-diag" transform="rotate(45)"/><use href="#rv-diag" transform="rotate(135)"/>
    <use href="#rv-diag" transform="rotate(225)"/><use href="#rv-diag" transform="rotate(315)"/>
  </g>
  <!-- cardinal points with fleur-de-lis -->
  <g>
    <use href="#rv-card"/><use href="#rv-card" transform="rotate(90)"/>
    <use href="#rv-card" transform="rotate(180)"/><use href="#rv-card" transform="rotate(270)"/>
  </g>

  <!-- center medallion -->
  <circle r="15.5" fill="currentColor" fill-opacity=".14" stroke-width="1.5"/>
  <circle r="12.2" stroke-width=".8" stroke-dasharray="1.2 1.6"/>
  <path d="M0-9 L2-2 L9 0 L2 2 L0 9 L-2 2 L-9 0 L-2-2 Z" fill="currentColor" stroke-width=".6"/>
  <circle r="2" fill="currentColor" fill-opacity=".2" stroke-width=".7"/>
</svg>
